camera_navigator:
  ros__parameters:

    use_sim_time: true


    # ================= SPEED SETTINGS =================

    cruise_speed: 2.00
    search_speed: 0.75
    approach_speed: 0.65
    cautious_speed: 0.40


    # ================= OBSTACLE SAFETY =================

    emergency_distance: 0.40
    stop_distance: 0.55
    turn_clearance: 0.30
    slow_distance: 1.20


    # ================= ARRIVAL =================

    arrival_distance: 0.60
    target_min_area_fraction: 0.001


    # ================= CAMERA / CONTROL =================

    camera_timeout: 1.5
    command_rate: 15.0

    maximum_depth: 8.0

    horizontal_fov: 1.74533
    surround_horizontal_fov: 1.74533


    # ================= PATH PLANNER =================

    planner_bins: 90
    planner_candidates: 45

    planner_max_heading: 1.39626

    planner_heading_gain: 0.85
    planner_hysteresis: 1.50
    planner_switch_penalty: 1.00


    # ================= ROBOT DIMENSIONS =================

    robot_width: 0.43

    gap_safety_margin: 0.05

    robot_half_length: 0.255
    robot_half_width: 0.215


    # ================= REVERSE RECOVERY =================

    reverse_speed: 0.35

    reverse_stuck_timeout: 3.0
    reverse_duration: 1.5


    # ================= KNOWN BAY POSITIONS =================
    # Matches updated warehouse.sdf

    use_known_bay_poses: true

    red_bay_x: 4.45
    red_bay_y: -3.00

    green_bay_x: 4.45
    green_bay_y: 3.00

    blue_bay_x: 4.45
    blue_bay_y: 0.00


    # ================= EXPLORATION =================

    known_goal_search_radius: 0.90

    exploration_distance: 1.20

    exploration_stall_timeout: 8.0

    exploration_clearance: 0.70