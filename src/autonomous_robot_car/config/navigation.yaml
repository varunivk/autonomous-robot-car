camera_navigator:
  ros__parameters:
    use_sim_time: true
    cruise_speed: 0.34
    search_speed: 0.20
    approach_speed: 0.28
    cautious_speed: 0.12
    emergency_distance: 0.46
    stop_distance: 0.62
    turn_clearance: 0.34
    slow_distance: 1.35
    arrival_distance: 0.72
    target_min_area_fraction: 0.001
    camera_timeout: 1.5
    command_rate: 10.0
    maximum_depth: 8.0
    horizontal_fov: 1.74533
    surround_horizontal_fov: 1.74533
    planner_bins: 72
    planner_candidates: 33
    planner_max_heading: 1.39626
    planner_heading_gain: 0.95
    planner_hysteresis: 1.25
    planner_switch_penalty: 0.75
    robot_width: 0.43
    gap_safety_margin: 0.08
    robot_half_length: 0.255
    robot_half_width: 0.215
    reverse_speed: 0.16
    reverse_stuck_timeout: 3.0
    reverse_duration: 1.8
    # Saved approach poses in the simulation's startup odom frame. These let
    # the robot route toward a bay before its colored panel is visible.
    use_known_bay_poses: true
    red_bay_x: 5.35
    red_bay_y: -3.00
    green_bay_x: 5.35
    green_bay_y: 3.00
    blue_bay_x: 5.35
    blue_bay_y: 0.00
    known_goal_search_radius: 0.90
    exploration_distance: 1.00
    exploration_stall_timeout: 9.0
    exploration_clearance: 0.75
